name: Check study interface
on:
  push:
    branches: ['codex/study-layout']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_TARGET: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-native-cache.cjs
      - run: node scripts/check-layout.cjs
      - run: node scripts/check-whitelist.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-layout-screenshots
          path: layout-checks/
