name: Check study interface
on:
  push:
    branches: ['codex/study-layout', 'feat/wordtok-learning-strategies']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_TARGET: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --test mcp/relay.test.mjs
      - run: npx --yes tsx scripts/check-learning.ts
      - run: npx --yes tsx scripts/check-whitelist-save.ts
      - run: npx --yes tsx scripts/check-ai.ts
      - run: npx --yes tsx scripts/check-library-management.ts
      - run: npx --yes tsx scripts/check-pages.ts
      - run: npx --yes tsx scripts/check-pages-relay.ts
      - run: npx --yes tsx scripts/check-card-parser.ts
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-native-cache.cjs
      - run: node scripts/check-ai-ui.cjs
      - run: node scripts/check-pages-ui.cjs
      - run: node scripts/check-native-pager-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-layout-screenshots
          path: layout-checks/

