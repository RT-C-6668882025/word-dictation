name: Retire web version
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retire-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  retire:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Prepare empty site
        run: |
          mkdir retired-site
          printf '%s\n' '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>404</title><p>WordTok 网页版已下线。</p></html>' > retired-site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: retired-site
      - uses: actions/deploy-pages@v4
