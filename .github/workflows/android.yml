name: Build Android APK
on:
  push:
    branches: [main, codex/general-memory-cards]
  workflow_dispatch:
    inputs:
      ai_relay_url:
        description: '正式 HTTPS MCP 连接服务地址（须先验证）'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: android-apk-v4
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app for Android
        run: npm run build
        env:
          BUILD_TARGET: android
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_AI_RELAY_URL: ${{ inputs.ai_relay_url || vars.AI_RELAY_URL }}
      - name: Verify native JavaScript engine
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.7.15/rhino-1.7.15.jar -o /tmp/rhino.jar
          cat native/ai-engine.js scripts/check-native-ai.js > /tmp/native-ai-suite.js
          java -cp /tmp/rhino.jar org.mozilla.javascript.tools.shell.Main -version 200 -opt -1 /tmp/native-ai-suite.js
          npx --yes tsx scripts/check-library-management.ts
          npx --yes tsx scripts/check-pages.ts
          npx --yes tsx scripts/check-pages-relay.ts
          npx --yes tsx scripts/check-ai.ts
          node --test mcp/relay.test.mjs
      - name: Verify layout in Chromium
        env:
          BUILD_TARGET: android
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/check-native-cache.cjs
          node scripts/check-ai-ui.cjs
          node scripts/check-pages-ui.cjs
          node scripts/check-native-pager-ui.cjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-checks
          path: layout-checks/
      - name: Create Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android app version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number); process.stdout.write(String(a*10000+b*100+c))")"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Install Pocket TTS Android bridge
        run: |
          cp native/PocketTtsPlugin.java android/app/src/main/java/com/rtc/worddictation/PocketTtsPlugin.java
          cp native/StudyPagerPlugin.java android/app/src/main/java/com/rtc/worddictation/StudyPagerPlugin.java
          cp native/AiConnectionPlugin.java android/app/src/main/java/com/rtc/worddictation/AiConnectionPlugin.java
          cp native/AiConnectionService.java android/app/src/main/java/com/rtc/worddictation/AiConnectionService.java
          cp native/AiWordStore.java android/app/src/main/java/com/rtc/worddictation/AiWordStore.java
          mkdir -p android/app/src/test/java/com/rtc/worddictation
          cp native/StudyPagerTest.java android/app/src/test/java/com/rtc/worddictation/StudyPagerTest.java
          cp native/AppUpdaterTest.java android/app/src/test/java/com/rtc/worddictation/AppUpdaterTest.java
          cp native/AiWordStoreTest.java android/app/src/test/java/com/rtc/worddictation/AiWordStoreTest.java
          cp native/ai-engine.js android/app/src/main/assets/ai-engine.js
          cp native/AppUpdaterPlugin.java android/app/src/main/java/com/rtc/worddictation/AppUpdaterPlugin.java
          cp native/InstallResultActivity.java android/app/src/main/java/com/rtc/worddictation/InstallResultActivity.java
          cp native/clear-web-cache.js android/app/src/main/assets/clear-web-cache.js
          cp native/MainActivity.java android/app/src/main/java/com/rtc/worddictation/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/updater_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cached_updates" path="updates/" />
              <files-path name="updates" path="updates/" />
          </paths>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          import re
          manifest_extra='\\1\\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\\n    <queries>\\n        <intent>\\n            <action android:name="android.intent.action.TTS_SERVICE" />\\n        </intent>\\n    </queries>'
          s=re.sub(r'(<manifest[^>]*>)', manifest_extra, s, count=1)
          install_queries='''<intent><action android:name="android.intent.action.INSTALL_PACKAGE" /><data android:mimeType="application/vnd.android.package-archive" /></intent>
              <intent><action android:name="android.intent.action.VIEW" /><data android:mimeType="application/vnd.android.package-archive" /></intent>
              <package android:name="com.miui.packageinstaller" />
              <package android:name="com.android.packageinstaller" />
              <package android:name="com.google.android.packageinstaller" />
              <package android:name="com.samsung.android.packageinstaller" />'''
          s=s.replace('</queries>', install_queries+'\n    </queries>')
          provider='''\n        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="com.rtc.worddictation.updater"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/updater_paths" />
          </provider>'''
          s=s.replace("</application>", provider+"\n    </application>")
          activity='''\n        <activity
              android:name=".InstallResultActivity"
              android:theme="@android:style/Theme.Translucent.NoTitleBar"
              android:exported="false"
              android:excludeFromRecents="true" />'''
          s=s.replace("</application>", activity+"\n    </application>")

          permissions='\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n'
          s=s.replace("<application", permissions+"\n    <application", 1)
          service='''\n        <service android:name=".AiConnectionService" android:exported="false" android:stopWithTask="true" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="User-enabled persistent remote command session: paired AI agents read and edit local wordbooks with durable operation receipts while the app is backgrounded. Ends when the user closes the app or unpairs. This is an interactive automation endpoint, not a periodic data synchronization job." /></service>'''
          s=s.replace("</application>", service+"\n    </application>")
          p.write_text(s)
          PY
          cat >> android/build.gradle <<'EOF'

          allprojects {
              repositories {
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation('com.github.k2-fsa:sherpa-onnx:v1.13.8') {
                  exclude group: 'com.github.k2-fsa.sherpa-onnx', module: 'sherpa-onnx-jvm'
              }
              implementation 'org.apache.commons:commons-compress:1.27.1'
              implementation 'org.mozilla:rhino:1.7.15'
              implementation 'androidx.viewpager2:viewpager2:1.1.0'
              implementation 'androidx.webkit:webkit:1.12.1'
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.robolectric:robolectric:4.14.1'
          }

          android {
              testOptions { unitTests.includeAndroidResources = true }
              defaultConfig {
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
          }
          EOF

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/word-dictation-release.jks
          test -s android/app/word-dictation-release.jks

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("word-dictation-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk word-dictation.apk

      - name: Verify APK identity and version
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          BADGING="$("$AAPT" dump badging word-dictation.apk | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='com.rtc.worddictation'"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_CODE="$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number);process.stdout.write(String(a*10000+b*100+c))")"
          echo "$BADGING" | grep -F "versionCode='${EXPECTED_CODE}'"
          echo "$BADGING" | grep -F "versionName='${EXPECTED_VERSION}'"

      - name: Verify permanent APK signature
        env:
          EXPECTED_CERT_SHA256: b85efa80fe3ff6294bc5f00d572b5ecc0bf0d2ac98e3175d2acb136a9929e156
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs word-dictation.apk | tee signature.txt
          grep -Fqi "$EXPECTED_CERT_SHA256" signature.txt

      - uses: actions/upload-artifact@v4
        with:
          name: word-dictation-apk
          path: word-dictation.apk
          retention-days: 30

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES="## Word Dictation v${VERSION}

          - 轻触内容块直接切换显隐；侧边学习菜单整合首页、索引、语音、范围与重置显隐
          - Agent 可为每个内容块独立设置初始显隐，并选择三种预设版式
          - 调整朗读与显隐触控区域，保持原有配色、词库及白名单"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --target "${GITHUB_SHA}" --title "Word Dictation v${VERSION}" --notes "${NOTES}" --latest
            gh release upload "${TAG}" word-dictation.apk --clobber
          else
            gh release create "${TAG}" word-dictation.apk --target "${GITHUB_SHA}" --title "Word Dictation v${VERSION}" --notes "${NOTES}" --latest
          fi

          # Keep the stable /latest/download URL working for old clients.
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "${GITHUB_SHA}"
            gh release upload latest word-dictation.apk --clobber
          else
            gh release create latest word-dictation.apk --target "${GITHUB_SHA}" --title "Word Dictation APK" --notes "稳定下载入口。" 
          fi

      - name: Remove signing key
        if: always()
        run: rm -f android/app/word-dictation-release.jks

