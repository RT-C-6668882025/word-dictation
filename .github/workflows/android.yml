name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-v4
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app for Android
        run: npm run build
        env:
          BUILD_TARGET: android
          VITE_COMMIT_SHA: ${{ github.sha }}
      - name: Create Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android

      - name: Configure Android app version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number); process.stdout.write(String(a*10000+b*100+c))")"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Install Pocket TTS Android bridge
        run: |
          cp native/PocketTtsPlugin.java android/app/src/main/java/com/rtc/worddictation/PocketTtsPlugin.java
          cp native/AppUpdaterPlugin.java android/app/src/main/java/com/rtc/worddictation/AppUpdaterPlugin.java
          cp native/MainActivity.java android/app/src/main/java/com/rtc/worddictation/MainActivity.java
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/updater_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="updates" path="." />
          </paths>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          import re
          s=re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />', s, count=1)
          provider='''\n        <provider
              android:name="androidx.core.content.FileProvider"
              android:authorities="com.rtc.worddictation.updater"
              android:exported="false"
              android:grantUriPermissions="true">
              <meta-data
                  android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/updater_paths" />
          </provider>'''
          s=s.replace("</application>", provider+"\n    </application>")
          p.write_text(s)
          PY
          cat >> android/build.gradle <<'EOF'

          allprojects {
              repositories {
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              implementation('com.github.k2-fsa:sherpa-onnx:v1.13.8') {
                  exclude group: 'com.github.k2-fsa.sherpa-onnx', module: 'sherpa-onnx-jvm'
              }
              implementation 'org.apache.commons:commons-compress:1.27.1'
          }

          android {
              defaultConfig {
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }
          }
          EOF

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/word-dictation-release.jks
          test -s android/app/word-dictation-release.jks

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("word-dictation-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk word-dictation.apk

      - name: Verify APK identity and version
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          BADGING="$("$AAPT" dump badging word-dictation.apk | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='com.rtc.worddictation'"
          echo "$BADGING" | grep -F "versionCode='406'"
          echo "$BADGING" | grep -F "versionName='0.4.6'"

      - name: Verify permanent APK signature
        env:
          EXPECTED_CERT_SHA256: b85efa80fe3ff6294bc5f00d572b5ecc0bf0d2ac98e3175d2acb136a9929e156
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs word-dictation.apk | tee signature.txt
          grep -Fqi "$EXPECTED_CERT_SHA256" signature.txt

      - uses: actions/upload-artifact@v4
        with:
          name: word-dictation-apk
          path: word-dictation.apk
          retention-days: 30

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES="## Word Dictation v${VERSION}

          - 新增应用内更新：不再跳浏览器下载 APK
          - App 内显示下载进度，并自动切换下载源
          - 下载完成后直接唤起 Android 系统安装器
          - 继续使用固定签名与递增 versionCode，覆盖更新保留词库
          - 词库使用 localStorage + Android Preferences 双重持久化
          - 更新 APK 下载后校验 SHA-256、包名、版本与固定签名\n          - 损坏下载自动切换下载源，不再交给系统安装器"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --target "${GITHUB_SHA}" --title "Word Dictation v${VERSION}" --notes "${NOTES}" --latest
            gh release upload "${TAG}" word-dictation.apk --clobber
          else
            gh release create "${TAG}" word-dictation.apk --target "${GITHUB_SHA}" --title "Word Dictation v${VERSION}" --notes "${NOTES}" --latest
          fi

          # Keep the stable /latest/download URL working for old clients.
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --target "${GITHUB_SHA}"
            gh release upload latest word-dictation.apk --clobber
          else
            gh release create latest word-dictation.apk --target "${GITHUB_SHA}" --title "Word Dictation APK" --notes "稳定下载入口。" 
          fi

      - name: Remove signing key
        if: always()
        run: rm -f android/app/word-dictation-release.jks
